name: 问题反馈 / Bug report
title: '[Bug] '
description: 报告 Tez 的使用问题 / Report a problem with Tez
labels: ['bug']

body:
  - type: input
    id: version
    attributes:
      label: Tez 版本 / Version
      placeholder: 0.3.11 (build 17)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS 版本 / macOS version
      placeholder: macOS 26.5, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述 / What happened
      description: 实际结果与期望结果 / Actual and expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或相关日志 / Screenshots or relevant logs
      description: 日志中请隐去订阅地址、令牌和密码 / Redact subscription URLs, tokens, and passwords
    validations:
      required: false
