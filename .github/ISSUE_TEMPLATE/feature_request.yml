name: 功能建议 / Feature request
title: '[Feature] '
description: 提出 Tez 的功能或交互建议 / Suggest a feature or interaction for Tez
labels: ['enhancement']

body:
  - type: textarea
    id: task
    attributes:
      label: 使用场景 / Use case
      description: 你正在完成什么任务？ / What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果 / Desired outcome
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 示例或参考 / Examples or references
    validations:
      required: false
